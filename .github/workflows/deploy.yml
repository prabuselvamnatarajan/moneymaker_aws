name: CI/CD Pipeline

# Branch pushes only. Tag pushes are ignored so a tag named "latest" cannot
# overwrite the production image tags. Pull requests are not a second trigger:
# a same-repo branch push already runs this workflow.
on:
  push:
    branches:
      - "*"
      - "**"

env:
  IMAGE_REGISTRY: ${{ secrets.DOCKERHUB_USERNAME || 'prabuselvamnatarajan' }}

jobs:
  build:
    name: Build and push images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: cicd-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      image_tag: ${{ steps.set-tag.outputs.image_tag }}
      unit_images: ${{ steps.list-unit.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Docker Image Tag
        id: set-tag
        run: |
          set -eu
          branch="${GITHUB_REF#refs/heads/}"
          . ./scripts/lib/image-tag.sh
          tag=$(branch_destination_tag "$branch")
          if [ "$branch" != "main" ] && [ "$tag" = "latest" ]; then
            echo "ERROR: branch name maps to latest; refusing to overwrite the production tag" >&2
            exit 1
          fi
          validate_image_tag "$tag" "image tag"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Image tag for branch ${branch}: $tag"

      - name: List unit-test images
        id: list-unit
        run: |
          set -eu
          chmod +x scripts/list-unit-test-images.sh
          images=$(./scripts/list-unit-test-images.sh)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Unit-test images: $images"

      - name: Make scripts executable
        run: |
          chmod +x scripts/build-images.sh scripts/pull-images.sh scripts/deploy-k8s.sh
          chmod +x scripts/list-unit-test-images.sh scripts/run-image-unit-tests.sh
          chmod +x build-all.sh run_all_test_cases.sh clear-and-seed.sh kill-moneymaker.sh
          find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.IMAGE_REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          ./scripts/build-images.sh \
            --profile full \
            --registry "$IMAGE_REGISTRY" \
            --tag "$IMAGE_TAG" \
            --push \
            --parallel 4
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.image_tag }}
          # Used after/before push to force Hub repos public (account default may be private).
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  unit:
    name: Unit tests (${{ matrix.image }})
    needs: build
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.build.outputs.unit_images) }}
    concurrency:
      group: cicd-unit-${{ github.workflow }}-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x scripts/run-image-unit-tests.sh
          find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Run unit tests for image
        run: |
          ./scripts/run-image-unit-tests.sh \
            --registry "$IMAGE_REGISTRY" \
            --tag "$IMAGE_TAG" \
            --image "$IMAGE_NAME"
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          IMAGE_NAME: ${{ matrix.image }}

  e2e:
    name: End-to-end tests
    needs: build
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cicd-e2e-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PLAYWRIGHT_WITH_DEPS: "1"
      STACK_HEALTH_MAX_RETRIES: "120"
      STACK_HEALTH_DELAY_SEC: "5"
      SKIP_CI_SEED: "1"
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      API_BASE_URL: http://127.0.0.1/backtestapp/
      UI_BASE_URL: http://127.0.0.1/backtest-ui/
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright before Kubernetes starts
        run: |
          export ROOT="${GITHUB_WORKSPACE}"
          # shellcheck disable=SC1091
          . "$ROOT/scripts/test/lib/common.sh"
          ensure_e2e_deps
          ensure_playwright_browsers

      - name: Make scripts executable
        run: |
          chmod +x scripts/pull-images.sh scripts/deploy-k8s.sh
          chmod +x build-all.sh run_all_test_cases.sh clear-and-seed.sh kill-moneymaker.sh
          find scripts -type f -name '*.sh' -exec chmod +x {} +

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.IMAGE_REGISTRY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull E2E images
        run: |
          ./scripts/pull-images.sh \
            --profile e2e \
            --registry "$IMAGE_REGISTRY" \
            --tag "$IMAGE_TAG" \
            --parallel 4

      - name: Deploy CI stack
        run: ./scripts/deploy-k8s.sh --detach --overlay ci

      - name: Wait for BackTestApp Health
        env:
          API_BASE_URL: http://127.0.0.1/backtestapp/
          UI_BASE_URL: http://127.0.0.1/backtest-ui/
        run: |
          export ROOT="${GITHUB_WORKSPACE}"
          if [ -f /etc/rancher/k3s/k3s.yaml ]; then
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml || true
            mkdir -p "$HOME/.kube"
            sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
            sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          fi
          . "$ROOT/scripts/test/lib/common.sh"
          . "$ROOT/scripts/test/lib/stack.sh"
          ensure_stack_ready all

      - name: Seed BacktestApp Database
        run: |
          if [ -f /etc/rancher/k3s/k3s.yaml ]; then
            mkdir -p "$HOME/.kube"
            sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
            sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          fi
          ./clear-and-seed.sh --yes

      - name: Run end-to-end tests
        env:
          API_BASE_URL: http://127.0.0.1/backtestapp/
          UI_BASE_URL: http://127.0.0.1/backtest-ui/
        run: |
          if [ -f /etc/rancher/k3s/k3s.yaml ]; then
            mkdir -p "$HOME/.kube"
            sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
            sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          fi
          ./run_all_test_cases.sh --coverage

      - name: Dump Kubernetes Diagnostics on Failure
        if: failure()
        run: |
          if [ -f /etc/rancher/k3s/k3s.yaml ]; then
            mkdir -p "$HOME/.kube"
            sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
            sudo chown "$(id -u):$(id -g)" "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          fi
          kubectl get ns || true
          kubectl -n moneymaker get all,ingress,pvc 2>&1 || true
          kubectl -n moneymaker describe deployment/backtest-app 2>&1 | tail -80 || true
          kubectl -n moneymaker describe deployment/reverse-proxy 2>&1 | tail -80 || true
          kubectl -n moneymaker describe statefulset/mongo1 2>&1 | tail -40 || true
          echo "===== reverse-proxy logs ====="
          kubectl -n moneymaker logs -l app=reverse-proxy --tail=80 2>&1 || true
          echo "===== backtest-app logs ====="
          kubectl -n moneymaker logs -l app=backtest-app --tail=80 2>&1 || true
          echo "===== curl via Ingress (127.0.0.1) ====="
          curl -sv http://127.0.0.1/backtestapp/health || true
          echo "===== curl on cluster network ====="
          kubectl -n moneymaker run mm-diag-curl --rm -i --restart=Never --image=curlimages/curl:8.5.0 -- \
            -sv http://backtest-app/health || true
          kubectl -n moneymaker run mm-diag-proxy --rm -i --restart=Never --image=curlimages/curl:8.5.0 -- \
            -sv http://reverse-proxy/backtestapp/health || true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to AWS
    needs: [unit, e2e]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Deploy tested images to AWS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          command_timeout: 60m
          envs: DEPLOY_PATH,IMAGE_REGISTRY,GITHUB_SHA
          script: |
            set -eu
            deploy_path="${DEPLOY_PATH:-$HOME/moneymaker_aws}"
            case "$deploy_path" in
              *..*)
                echo "ERROR: DEPLOY_PATH must not contain .." >&2
                exit 1
                ;;
              /[A-Za-z0-9._/-]*)
                ;;
              *)
                echo "ERROR: DEPLOY_PATH must be an absolute path without spaces" >&2
                exit 1
                ;;
            esac
            cd "$deploy_path"
            git fetch --no-tags origin main
            tip=$(git rev-parse refs/remotes/origin/main)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "Skipping deploy; origin/main is $tip, this run is $GITHUB_SHA"
              exit 0
            fi
            git checkout --force --detach "$GITHUB_SHA"
            chmod +x scripts/pull-images.sh scripts/deploy-k8s.sh
            ./scripts/pull-images.sh \
              --profile full \
              --registry "$IMAGE_REGISTRY" \
              --tag latest \
              --parallel 4
            git fetch --no-tags origin main
            tip=$(git rev-parse refs/remotes/origin/main)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "Skipping deploy; origin/main moved to $tip while images were pulling"
              exit 0
            fi
            ./scripts/deploy-k8s.sh --overlay full
