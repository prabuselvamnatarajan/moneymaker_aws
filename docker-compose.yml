version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: zookeeper:2888:3888
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - app-net

  kafka-broker-1:
    image: bitnami/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    networks:
      - app-net
  
  kafka-broker-2:
    image: bitnami/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9093:9092"
    networks:
      - app-net
  
  kafka-broker-3:
    image: bitnami/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9092"
    networks:
      - app-net

  mongo1:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_REPLICA_SET_NAME: rs0
    networks:
      - app-net

  mongo2:
    image: mongo:6.0
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_REPLICA_SET_NAME: rs0
    networks:
      - app-net

  mongo3:
    image: mongo:6.0
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_REPLICA_SET_NAME: rs0
    networks:
      - app-net

  wsdatasplitter-consumer:
    image: prabuselvam/wsdatasplitterconsumer:latest
    depends_on:
      - kafka-broker-1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  price-storer-consumer:
    image: prabuselvam/storer-consumer:latest
    depends_on:
      - kafka-broker-1
      - mongo1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      MONGO_URI: mongodb://root:example@mongo1:27017
      TARGET_COLLECTION_NAME: stock_database
      TARGET_TOPIC: splited-live-data
      TARGET_GROUP_ID: storer-group
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  order-storer-consumer:
    image: prabuselvam/storer-consumer:latest
    depends_on:
      - kafka-broker-1
      - mongo1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      MONGO_URI: mongodb://root:example@mongo1:27017
      TARGET_COLLECTION_NAME: order_details
      TARGET_TOPIC: order_details
      TARGET_GROUP_ID: order_storer_group
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net
  
  strategy-chooser-consumer:
    image: prabuselvam/strategy-chooser-consumer:latest
    depends_on:
      - kafka-broker-1
      - mongo1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      TARGET_TOPIC: splited-live-data,backtest-stream-data
      BACKTEST_TOPIC: backtest-stream-data
      TARGET_GROUP_ID: strategy_chooser_group
      SHARED_DIR: /shared
    volumes:
      - shared-space:/shared
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  backtest-streamer:
    image: prabuselvam/backteststreamer:latest
    environment:
      PORT: 8085
      SHARED_DIR: /shared
    volumes:
      - backtest-data:/shared
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  backtest-client:
    image: prabuselvam/backtestclient:latest
    depends_on:
      - kafka-broker-1
    environment:
      CLIENT_PORT: 80
      WS_URL: ws://localhost/wsbacktest
      KAFKA_BROKERS: kafka-broker-1:9092
      KAFKA_TOPIC: backtest-stream-data
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  upstock-login:
    image: upstock-login:latest
    ports:
      - "8080:80"
    environment:
      CLIENT_ID: 50b489f2-22c5-4824-9da5-9b815aab9667
      CLIENT_SECRET: d51apkeb3c
      REDIRECT_URI: http://localhost/logedin
      MONGODB_URI: mongodb://root:example@mongo1:27017
      MONGODB_DB_NAME: UPLINK_SERVER_USER_DATA
      PORT: 80
      SHARED_DIR: /shared
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  connect-upstox-web-socket:
    image: connect-upstox-web-socket:latest
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-ltp:
    image: get-ltp:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-ohlc:
    image: get-ohlc:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-fullmarketquote:
    image: get-fullmarketquote:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  placeorder:
    image: placeorder:latest
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      TARGET_TOPIC: order_details
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-orderbook:
    image: get-orderbook:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  reverse-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/self-signed.crt:/etc/nginx/self-signed.crt:ro
      - ./certs/self-signed.key:/etc/nginx/self-signed.key:ro
    depends_on:
      - upstock-login
      - connect-upstox-web-socket
      - get-ltp
      - get-ohlc
      - get-fullmarketquote
      - get-orderbook
      - placeorder
      - backtest-streamer
      - backtest-client
    networks:
      - app-net

volumes:
  mongo1-data:
    driver: local
  mongo2-data:
    driver: local
  mongo3-data:
    driver: local
  shared-space:
  backtest-data:

networks:
  app-net:
    driver: overlay



