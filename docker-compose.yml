version: '3.8'

services:
  zookeeper:
    image: bitnamilegacy/zookeeper:latest
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: zookeeper:2888:3888
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - app-net

  kafka-broker-1:
    image: bitnamilegacy/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    networks:
      - app-net
  
  kafka-broker-2:
    image: bitnamilegacy/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9093:9092"
    networks:
      - app-net
  
  kafka-broker-3:
    image: bitnamilegacy/kafka:3.4.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9092"
    networks:
      - app-net

  mongo1:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
      - ./mongo/mongod.conf:/etc/mongod.conf
      - ./mongo/mongo-keyfile:/etc/mongo-keyfile:ro
      - ./mongo/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - app-net

  mongo2:
    image: mongo:6.0
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
      - ./mongo/mongod.conf:/etc/mongod.conf
      - ./mongo/mongo-keyfile:/etc/mongo-keyfile:ro
      - ./mongo/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - app-net

  mongo3:
    image: mongo:6.0
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
      - ./mongo/mongod.conf:/etc/mongod.conf
      - ./mongo/mongo-keyfile:/etc/mongo-keyfile:ro
      - ./mongo/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    networks:
      - app-net
      
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
    networks:
      - app-net

  redis:
    image: redis/redis-stack:latest
    networks:
      - app-net
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    environment:
      - REDIS_ARGS=--requirepass myStrongRedisPassword --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  redisinsight:
    image: redislabs/redisinsight:1.14.0
    networks:
      - app-net
    volumes:
      - redisinsight_data:/db
    environment:
      - TZ=UTC
    ports:
      - "8001:8001"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  exporttofile:
    image: exporttofile:latest
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    environment:
      MONGO_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      DB_NAME: stock_database
      EXPORT_PREF_COLLECTION: exportPreferences
      EXPORT_CRON_SCHEDULE: 15 16 * * *
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - app-net

  wsdatasplitter-consumer:
    image: wsdatasplitterconsumer:latest
    depends_on:
      - kafka-broker-1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  price-storer-consumer:
    image: storer-consumer:latest
    depends_on:
      - kafka-broker-1
      - mongo1
      - mongo2
      - mongo3
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      MONGO_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      TARGET_COLLECTION_NAME: stock_database
      TARGET_TOPIC: splited-live-data
      TARGET_GROUP_ID: storer-group
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  order-storer-consumer:
    image: storer-consumer:latest
    depends_on:
      - kafka-broker-1
      - mongo1
      - mongo2
      - mongo3
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      MONGO_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      TARGET_COLLECTION_NAME: order_details
      TARGET_TOPIC: order_details
      TARGET_GROUP_ID: order_storer_group
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net
  
  strategy-chooser-consumer:
    image: strategy-chooser-consumer:latest
    depends_on:
      - kafka-broker-1
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      TARGET_TOPIC: splited-live-data,backtest-stream-data
      BACKTEST_TOPIC: backtest-stream-data
      TARGET_GROUP_ID: strategy_chooser_group
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  backtest-streamer:
    image: backteststreamer:latest
    environment:
      PORT: 8085
      SHARED_DIR: /shared
    volumes:
      - backtest-data:/shared
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  backtest-client:
    image: backtestclient:latest
    depends_on:
      - kafka-broker-1
    environment:
      CLIENT_PORT: 80
      WS_URL: ws://reverse-proxy/wsbacktest
      KAFKA_BROKERS: kafka-broker-1:9092
      KAFKA_TOPIC: backtest-stream-data
    deploy:
      replicas: 3
      restart_policy:
        condition: any
    networks:
      - app-net

  backtest-app:
    image: backtestapp:latest
    environment:
      PORT: 80
      MONGO_DB: BacktestApp
      MONGO_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    networks:
      - app-net

  appinit:
    image: appinit:latest
    depends_on:
      - mongo1
      - mongo2
      - mongo3
      - redis
    environment:
      MONGO_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      APP_INIT_DB: appInit
      DB_LIVE_STRATEGYCHOOSER: strategyChooser
      REDIS_LIVE_STRATEGYCHOOSER: '{"key":"strategies:live:","data_type":"json"}'
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
      PROPERTY_LIVE_STRATEGYCHOOSER: symbolName
      DB_LIVE_WEBSOCKETLISTENING: webSocketListening    # need to update this
      REDIS_LIVE_WEBSOCKETLISTENING: '{"key":"websocketlistening:live","data_type":"list"}'
      PROPERTY_LIVE_WEBSOCKETLISTENING: symbolName
    networks:
      - app-net

  upstock-login:
    image: upstock-login:latest
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    ports:
      - "8080:80"
    environment:
      CLIENT_ID: 50b489f2-22c5-4824-9da5-9b815aab9667
      CLIENT_SECRET: d51apkeb3c
      REDIRECT_URI: http://localhost/logedin
      MONGODB_URI: mongodb://root:example@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      MONGODB_DB_NAME: UPLINK_SERVER_USER_DATA
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
      PORT: 80
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
    networks:
      - app-net

  connect-upstox-web-socket:
    image: connect-upstox-web-socket:latest
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-ltp:
    image: get-ltp:latest
    environment:
      PORT: 80
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
      - ./MicroServices/Shared/AuthorisedUpstox/AuthoriseUpstoxClient.js:/app/redis_utils/AuthoriseUpstoxClient.js:ro
    networks:
      - app-net

  get-ohlc:
    image: get-ohlc:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-fullmarketquote:
    image: get-fullmarketquote:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  placeorder:
    image: placeorder:latest
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      TARGET_TOPIC: order_details
      PORT: 80
      NGINX_ADDRESS: http://reverse-proxy
      FUNDS_AND_MARGIN_API_URL: /fundsandmargin
      BACKTEST_APP_URL: /backtestapp
      BACKTEST_TRADE_URL: /api/trade
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
      - ./MicroServices/Shared/Accounts/account_utils.js:/app/redis_utils/account_utils.js:ro
      - shared-space:/shared
    networks:
      - app-net

  get-orderbook:
    image: get-orderbook:latest
    environment:
      PORT: 80
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
      - ./MicroServices/Shared/AuthorisedUpstox/AuthoriseUpstoxClient.js:/app/redis_utils/AuthoriseUpstoxClient.js:ro
    networks:
      - app-net

  get-funds-and-margin:
    image: get-funds-and-margin:latest
    environment:
      PORT: 80
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
      - ./MicroServices/Shared/AuthorisedUpstox/AuthoriseUpstoxClient.js:/app/redis_utils/AuthoriseUpstoxClient.js:ro
    networks:
      - app-net

  get-put-call-option-chain:
    image: get-put-call-option-chain:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  get-option-contracts:
    image: get-option-contracts:latest
    environment:
      PORT: 80
    volumes:
      - shared-space:/shared
    networks:
      - app-net

  reverse-proxy:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/self-signed.crt:/etc/nginx/self-signed.crt:ro
      - ./certs/self-signed.key:/etc/nginx/self-signed.key:ro
    depends_on:
      - upstock-login
      - connect-upstox-web-socket
      - get-ltp
      - get-ohlc
      - get-fullmarketquote
      - get-orderbook
      - placeorder
      - backtest-streamer
      - backtest-client
    networks:
      - app-net

  msb-strategy:
    image: msb-strategy:latest
    environment:
      KAFKA_BROKERS: kafka-broker-1:9092
      BACKTEST_TOPIC_SUFFIX: _backtest_data
      LIVE_TOPIC_SUFFIX: _live_data
      STRATEGY_NAME: msb
      TARGET_GROUP_ID: msb_strategy_group
      SHARED_DIR: /shared
      PLACEORDER_API: http://placeorder
      REDIS_URL: redis://:myStrongRedisPassword@redis:6379
    volumes:
      - ./appInit/redis_operations:/app/redis_utils/redis_operations:ro
      - ./MicroServices/Shared/Accounts/account_utils.js:/app/redis_utils/account_utils.js:ro
    depends_on:
      - kafka-broker-1
    networks:
      - app-net

volumes:
  mongo1-data:
    driver: local
  mongo2-data:
    driver: local
  mongo3-data:
    driver: local
  shared-space:
  backtest-data:
  redis_data:
  redisinsight_data:

networks:
  app-net:
    driver: overlay



