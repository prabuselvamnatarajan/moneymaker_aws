# Minimal reverse-proxy for CI / E2E on Kubernetes.
# Same routes as certs/nginx.ci.conf; resolver uses cluster DNS (not Swarm 127.0.0.11).

events {
    worker_connections 1024;
}

http {
    client_max_body_size 500M;
    # Re-resolve Service names per request. A static proxy_pass looks them up
    # only at process start, and nginx exits when that lookup fails. Traefik
    # then answers every request with "503 no available server".
    #
    # Use the kube-dns / CoreDNS ClusterIP directly. Nginx's resolver does not
    # apply /etc/resolv.conf search domains, so short Service names never
    # resolve; upstreams below must be FQDNs. 10.43.0.10 is the default on k3s
    # (CI); kube-dns.kube-system.svc.cluster.local also works when resolvable
    # at nginx start via getaddrinfo.
    resolver 10.43.0.10 valid=5s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location /backtestapp/ {
            # FQDN required: nginx resolver ignores cluster search domains.
            set $upstream_backtest_app backtest-app.moneymaker.svc.cluster.local;
            rewrite ^/backtestapp/?(.*)$ /$1 break;
            proxy_pass http://$upstream_backtest_app:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /backtest-ui {
            return 301 /backtest-ui/;
        }

        location /backtest-ui/ {
            set $upstream_backtest_ui backtest-ui.moneymaker.svc.cluster.local;
            proxy_pass http://$upstream_backtest_ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
