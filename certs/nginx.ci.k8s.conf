# Minimal reverse-proxy for CI / E2E on Kubernetes.
# Same routes as certs/nginx.ci.conf; resolver uses cluster DNS (not Swarm 127.0.0.11).

events {
    worker_connections 1024;
}

http {
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location /backtestapp/ {
            set $upstream_backtest_app backtest-app;
            rewrite ^/backtestapp/?(.*)$ /$1 break;
            proxy_pass http://$upstream_backtest_app:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /backtest-ui {
            return 301 /backtest-ui/;
        }

        location /backtest-ui/ {
            set $upstream_backtest_ui backtest-ui;
            proxy_pass http://$upstream_backtest_ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
