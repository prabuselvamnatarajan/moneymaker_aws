# Minimal reverse-proxy for CI / E2E.
# Only upstreams that the e2e image profile builds (backtest-app, backtest-ui).
# Full nginx.conf fails to start when other Swarm service DNS names are missing.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        location /backtestapp/ {
            proxy_pass http://backtest-app:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /backtest-ui {
            return 301 /backtest-ui/;
        }

        location /backtest-ui/ {
            proxy_pass http://backtest-ui:80/backtest-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
