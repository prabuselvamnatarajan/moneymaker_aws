# Minimal reverse-proxy for CI / E2E.
# Only upstreams that the e2e image profile builds (backtest-app, backtest-ui).
# Listen on IPv4 and IPv6 — curl to "localhost" often uses ::1 first.
#
# Use rewrite + variable proxy_pass (no URI in proxy_pass) so /backtestapp/health
# becomes /health on the upstream. Variable+URI in proxy_pass skips prefix strip.

events {
    worker_connections 1024;
}

http {
    # Swarm DNS — re-resolve upstreams at request time so startup order is safe
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location /backtestapp/ {
            # set must come before rewrite ... break — both are rewrite-module
            # directives and break stops further rewrite-module processing.
            set $upstream_backtest_app backtest-app;
            rewrite ^/backtestapp/?(.*)$ /$1 break;
            proxy_pass http://$upstream_backtest_app:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /backtest-ui {
            return 301 /backtest-ui/;
        }

        location /backtest-ui/ {
            # UI is served under /backtest-ui/ on the container — keep the prefix
            set $upstream_backtest_ui backtest-ui;
            proxy_pass http://$upstream_backtest_ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
