# Minimal reverse-proxy for CI / E2E on Kubernetes.
# Same routes as certs/nginx.ci.conf; resolver uses cluster DNS (not Swarm 127.0.0.11).

events {
    worker_connections 1024;
}

http {
    client_max_body_size 500M;

    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        location /backtestapp/ {
            proxy_pass http://backtest-app:80/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        location = /backtest-ui {
            return 301 /backtest-ui/;
        }

        location /backtest-ui/ {
            proxy_pass http://backtest-ui:80/backtest-ui/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 404;
        }
    }
}
