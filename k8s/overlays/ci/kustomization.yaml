apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Replace nginx.conf with the CI-minimal Kubernetes config
configMapGenerator:
  - name: nginx-conf
    behavior: replace
    files:
      - nginx.conf=files/nginx.conf
    options:
      disableNameSuffixHash: true

patches:
  # CI pins replica counts. Drop HPAs so they cannot scale those Deployments back up.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: all
  # Scale down everything not required by BackTest E2E
  - target:
      kind: Deployment
      name: mongo-express
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: redisinsight
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: exporttofile
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: wsdatasplitter-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: price-storer-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: order-storer-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
