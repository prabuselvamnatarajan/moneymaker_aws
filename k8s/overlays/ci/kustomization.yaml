  # Scale down Kafka and Zookeeper StatefulSets in CI (E2E only tests BackTestApp and BackTestUI)
  - target:
      kind: StatefulSet
      name: zookeeper
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: kafka-broker-1
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: kafka-broker-2
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: StatefulSet
      name: kafka-broker-3
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # Skip appinit Job in CI (compose sets replicas: 0)
  - target:
      kind: Job
      name: appinit
    patch: |-
      - op: replace
        path: /spec/parallelism
        value: 0
      - op: replace
        path: /spec/completions
        value: 0
      - op: add
        path: /spec/suspend
        value: true
