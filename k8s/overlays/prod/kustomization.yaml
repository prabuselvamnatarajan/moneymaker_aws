apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied by scripts/aws/deploy-prod.sh (deploy workflow), which also:
#   - writes certificate-arn.env from the cluster's moneymaker-infra ConfigMap
#   - appends an images: block pointing every custom image at ECR:<commit sha>
#   - creates Secret moneymaker-secrets from the PROD_APP_SECRETS GitHub secret
# Cluster add-ons and StorageClasses (gp3, efs-sc) come from the infra
# workflow: scripts/aws/install-cluster-addons.sh + k8s/cluster/.
resources:
  - ../../base
  - mongo-init-signal-pvc.yaml

# ACM certificate ARN from terraform/prod output (acm_certificate_arn).
# The tracked file is a placeholder; deploy-prod.sh overwrites it on the runner.
configMapGenerator:
  - name: acm-certificate
    envs:
      - certificate-arn.env
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: acm-certificate
      fieldPath: data.CERTIFICATE_ARN
    targets:
      - select:
          kind: Ingress
          name: moneymaker
        fieldPaths:
          - metadata.annotations.[alb.ingress.kubernetes.io/certificate-arn]

patches:
  # --- Secrets: never ship the base dev passwords to prod ---
  # moneymaker-secrets is created by deploy-prod.sh from a GitHub secret.
  - target:
      kind: Secret
      name: moneymaker-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: moneymaker-secrets

  # --- Docker Hub pull secret for third-party images (mongo, kafka, nginx...) ---
  # Shared NAT IP + anonymous Docker Hub limits would throttle pulls. The
  # secret is created by deploy-prod.sh when DOCKERHUB_TOKEN is set; a missing
  # secret only logs a kubelet warning. App images come from ECR (node role).
  - target:
      kind: (Deployment|StatefulSet|Job)
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub-pull

  # --- Ingress: ALB + ACM (TLS terminated at the load balancer) ---
  # The ALB talks HTTPS to reverse-proxy:443 (self-signed; ALB does not verify
  # backend certs). nginx's :80 server redirects unknown paths to https, which
  # would loop behind an ALB that already terminated TLS.
  - target:
      kind: Ingress
      name: moneymaker
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          alb.ingress.kubernetes.io/certificate-arn: PLACEHOLDER
          alb.ingress.kubernetes.io/backend-protocol: HTTPS
          alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
          alb.ingress.kubernetes.io/healthcheck-path: /backtestapp/health
          alb.ingress.kubernetes.io/success-codes: "200"
          alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
      - op: replace
        path: /spec/ingressClassName
        value: alb
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 443
      - op: add
        path: /spec/rules/0/host
        value: algo.mrcobra.link
      - op: remove
        path: /spec/tls

  # --- Swarm replica floor: Deployment replicas + HPA minReplicas = 3 ---
  - target:
      kind: Deployment
      name: wsdatasplitter-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: wsdatasplitter-consumer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: price-storer-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: price-storer-consumer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: order-storer-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: order-storer-consumer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: strategy-chooser-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: strategy-chooser-consumer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: timeframe-constructor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: timeframe-constructor
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: backtest-streamer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: backtest-streamer
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target:
      kind: Deployment
      name: backtest-client
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: HorizontalPodAutoscaler
      name: backtest-client
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3

  # --- Shared backtest volume: RWX on EFS (multi-replica streamer) ---
  - path: backtest-data-patch.yaml
    target:
      kind: PersistentVolumeClaim
      name: backtest-data

  # --- Drop hostPort (pins pods to one node; not used on EKS) ---
  - target:
      kind: StatefulSet
      name: mongo1
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
      - op: remove
        path: /spec/template/spec/volumes/2/hostPath
      - op: add
        path: /spec/template/spec/volumes/2/persistentVolumeClaim
        value:
          claimName: mongo-init-signal
  - target:
      kind: StatefulSet
      name: mongo2
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
      - op: remove
        path: /spec/template/spec/volumes/2/hostPath
      - op: add
        path: /spec/template/spec/volumes/2/persistentVolumeClaim
        value:
          claimName: mongo-init-signal
  - target:
      kind: StatefulSet
      name: mongo3
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
      - op: remove
        path: /spec/template/spec/volumes/2/hostPath
      - op: add
        path: /spec/template/spec/volumes/2/persistentVolumeClaim
        value:
          claimName: mongo-init-signal
  - target:
      kind: StatefulSet
      name: kafka-broker-1
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: StatefulSet
      name: kafka-broker-2
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: StatefulSet
      name: kafka-broker-3
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: StatefulSet
      name: zookeeper
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: Deployment
      name: mongo-express
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
  - target:
      kind: Deployment
      name: redisinsight
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/0/hostPort
