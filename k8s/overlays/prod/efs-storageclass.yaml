# Apply after the EFS CSI driver is installed on the cluster.
# fileSystemId comes from terraform/prod output efs_file_system_id.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: REPLACE_WITH_EFS_ID
  directoryPerms: "700"
reclaimPolicy: Retain
volumeBindingMode: Immediate
