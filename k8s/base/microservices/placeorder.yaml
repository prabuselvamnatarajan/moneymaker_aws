apiVersion: v1
kind: Service
metadata:
  name: placeorder
  namespace: moneymaker
  labels:
    app: placeorder
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: placeorder
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placeorder
  namespace: moneymaker
  labels:
    app: placeorder
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placeorder
  template:
    metadata:
      labels:
        app: placeorder
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in zookeeper:2181 kafka-broker-1:9092 kafka-broker-2:9092 kafka-broker-3:9092 mongo1:27017 mongo2:27017 mongo3:27017 redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: placeorder
          image: placeorder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKERS
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_NUM_PARTITIONS
            - name: TARGET_TOPIC
              value: 'order_details'
            # parallel: broker call and ledger write run together (faster; a broker
            # rejection leaves an orphaned ledger trade). sequential: ledger only
            # after the broker accepts.
            - name: ORDER_LEDGER_MODE
              value: 'parallel'
            - name: PORT
              value: '80'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: MONGODB_URI
            - name: NGINX_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: NGINX_ADDRESS
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: '0'
            - name: FUNDS_AND_MARGIN_API_URL
              value: '/fundsandmargin'
            - name: BACKTEST_APP_URL
              value: '/backtestapp'
            - name: BACKTEST_TRADE_URL
              value: '/api/trades'
            - name: BACKTEST_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: BACKTEST_SERVICE_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: placeorder
  labels:
    app: placeorder
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: placeorder
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
