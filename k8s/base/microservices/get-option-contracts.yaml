apiVersion: v1
kind: Service
metadata:
  name: get-option-contracts
  namespace: moneymaker
  labels:
    app: get-option-contracts
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: get-option-contracts
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-option-contracts
  namespace: moneymaker
  labels:
    app: get-option-contracts
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: get-option-contracts
  template:
    metadata:
      labels:
        app: get-option-contracts
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in mongo1:27017 mongo2:27017 mongo3:27017 redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: get-option-contracts
          image: get-option-contracts:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: '80'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: MONGODB_URI
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: get-option-contracts
  labels:
    app: get-option-contracts
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: get-option-contracts
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
