apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moneymaker
  namespace: moneymaker
  labels:
    app.kubernetes.io/part-of: moneymaker
  annotations:
    # Traefik (k3s default): forward all paths to nginx reverse-proxy.
    # Path routing stays in nginx so Ingress and nginx.conf cannot drift.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reverse-proxy
                port:
                  number: 80
  tls:
    - secretName: reverse-proxy-tls
