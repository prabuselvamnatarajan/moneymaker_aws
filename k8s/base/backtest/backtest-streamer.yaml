apiVersion: v1
kind: Service
metadata:
  name: backtest-streamer
  namespace: moneymaker
  labels:
    app: backtest-streamer
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: backtest-streamer
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-streamer
  namespace: moneymaker
  labels:
    app: backtest-streamer
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtest-streamer
  template:
    metadata:
      labels:
        app: backtest-streamer
        app.kubernetes.io/part-of: moneymaker
    spec:
      containers:
        - name: backtest-streamer
          image: backteststreamer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: PORT
              value: '8085'
            - name: SHARED_DIR
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: SHARED_DIR
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: backtest-data

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backtest-streamer
  labels:
    app: backtest-streamer
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backtest-streamer
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
