apiVersion: v1
kind: Service
metadata:
  name: backtest-client
  namespace: moneymaker
  labels:
    app: backtest-client
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: backtest-client
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-client
  namespace: moneymaker
  labels:
    app: backtest-client
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backtest-client
  template:
    metadata:
      labels:
        app: backtest-client
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in zookeeper:2181 kafka-broker-1:9092 kafka-broker-2:9092 kafka-broker-3:9092; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: backtest-client
          image: backtestclient:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: CLIENT_PORT
              value: '80'
            - name: WS_URL
              value: 'ws://reverse-proxy/wsbacktest'
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKERS
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_NUM_PARTITIONS
            - name: KAFKA_TOPIC
              value: 'backtest-stream-data'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backtest-client
  labels:
    app: backtest-client
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backtest-client
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
