apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-config
  namespace: moneymaker
  labels:
    app.kubernetes.io/part-of: moneymaker
    app.kubernetes.io/component: mongo
data:
  mongod.conf: |
    storage:
      dbPath: /data/db
      wiredTiger:
        engineConfig:
          cacheSizeGB: 0.25
    net:
      bindIp: 0.0.0.0
      port: 27017
    replication:
      replSetName: rs0
    security:
      authorization: enabled
      keyFile: /data/keyfile
  mongod-bootstrap.conf: |
    storage:
      dbPath: /data/db
      wiredTiger:
        engineConfig:
          cacheSizeGB: 0.25
    net:
      bindIp: 0.0.0.0
      port: 27017
    replication:
      replSetName: rs0
  # Bitnami-inspired bootstrap (see bitnami/charts mongodb setup.sh):
  # - primary (mongo1) initiates with ONLY itself, then rs.add secondaries
  # - treat "already initialized" as success and force-reconfig hostnames if needed
  # - secondaries wait for /init-signal/done then start with auth+keyFile
  # - if /init-signal/done exists but RS is not configured (stale signal after PVC
  #   wipe), mongo1 clears the signal and re-bootstraps. Secondaries must not
  #   delete that shared file; they wait until mongo1 replaces it.
  init-mongo1.sh: |
    #!/bin/bash
    set -e

    echo "Preparing keyfile..."
    cp -f /etc/mongo-keyfile /data/keyfile || { rm -f /data/keyfile && cp /etc/mongo-keyfile /data/keyfile; }
    chmod 400 /data/keyfile
    chown mongodb:mongodb /data/keyfile

    stop_mongod_and_wait() {
      echo "Stopping mongod..."
      mongosh --quiet --eval "try { db.getSiblingDB('admin').shutdownServer({force: true}); } catch (e) {}" >/dev/null 2>&1 || true
      mongod --shutdown --dbpath /data/db || true
      local waited=0
      while pgrep -x mongod >/dev/null 2>&1 && [ "$waited" -lt 30 ]; do
        sleep 1
        waited=$((waited + 1))
      done
      if pgrep -x mongod >/dev/null 2>&1; then
        echo "mongod did not exit cleanly after shutdown, sending SIGKILL..."
        pkill -9 -x mongod || true
        sleep 1
      fi
      rm -f /data/db/mongod.lock
    }

    mongo_rs_configured() {
      mongosh --quiet --eval '
        try {
          var h = db.hello();
          if (h && h.setName) quit(0);
          quit(1);
        } catch (e) {
          quit(1);
        }
      ' >/dev/null 2>&1
    }

    if [ -f /init-signal/done ]; then
      echo "Init signal present — validating replica set before skipping bootstrap..."
      mongod --config /etc/mongod.conf --fork --logpath /tmp/mongod-probe.log
      until mongosh --quiet --eval "db.adminCommand('ping')" &>/dev/null; do
        sleep 1
      done
      if mongo_rs_configured; then
        echo "Replica set OK — starting with auth..."
        stop_mongod_and_wait
        exec mongod --config /etc/mongod.conf
      fi
      echo "Stale init signal (no replica set config) — clearing and re-bootstrapping..."
      stop_mongod_and_wait
      rm -f /init-signal/done
    fi

    echo "Starting MongoDB WITHOUT auth for bootstrap..."
    mongod --config /etc/mongod-bootstrap.conf --fork --logpath /tmp/mongod.log

    echo "Waiting for mongod to be ready..."
    until mongosh --quiet --eval "db.adminCommand('ping')" &>/dev/null; do
      sleep 1
    done

    echo "Waiting for mongo2/mongo3 to accept connections..."
    until mongosh --host mongo2 --port 27017 --quiet --eval "db.adminCommand('ping')" &>/dev/null; do
      echo "  ...mongo2 not ready, waiting..."
      sleep 2
    done
    until mongosh --host mongo3 --port 27017 --quiet --eval "db.adminCommand('ping')" &>/dev/null; do
      echo "  ...mongo3 not ready, waiting..."
      sleep 2
    done

    echo "Bootstrapping replica set (Bitnami-style: primary-only initiate, then rs.add)..."
    mongosh --quiet --eval '
      function forceDesiredConfig() {
        var cfg = {
          _id: "rs0",
          version: 1,
          members: [
            { _id: 0, host: "mongo1:27017", priority: 2 },
            { _id: 1, host: "mongo2:27017", priority: 1 },
            { _id: 2, host: "mongo3:27017", priority: 1 }
          ]
        };
        try {
          var cur = rs.conf();
          cfg.version = (cur.version || 1) + 1;
        } catch (e) {}
        return rs.reconfig(cfg, { force: true });
      }

      var initiated = false;
      try {
        rs.initiate({
          _id: "rs0",
          members: [ { _id: 0, host: "mongo1:27017", priority: 2 } ]
        });
        initiated = true;
        print("rs.initiate(primary-only) ok");
      } catch (e) {
        if (String(e).indexOf("already initialized") >= 0 || (e.code === 23)) {
          print("Replica set already initialized — repairing config if needed");
          forceDesiredConfig();
          initiated = true;
        } else {
          throw e;
        }
      }

      var primary = false;
      for (var i = 0; i < 90; i++) {
        try {
          var h = db.hello();
          if (h.isWritablePrimary) { primary = true; break; }
          if (h.primary) { primary = true; break; }
        } catch (e) {}
        sleep(2000);
      }
      if (!primary) {
        print("No primary yet — force reconfig with all members");
        forceDesiredConfig();
        sleep(5000);
      }

      function ensureMember(host) {
        try {
          var st = rs.status();
          var found = false;
          st.members.forEach(function(m) { if (m.name === host) found = true; });
          if (!found) {
            print("rs.add(" + host + ")");
            rs.add(host);
          } else {
            print(host + " already a member");
          }
        } catch (e) {
          print("Warning: rs.add failed for " + host + ": " + e);
        }
      }

      for (var j = 0; j < 60; j++) {
        try {
          if (db.hello().isWritablePrimary) break;
        } catch (e) {}
        sleep(2000);
      }

      if (db.hello().isWritablePrimary) {
        ensureMember("mongo2:27017");
        ensureMember("mongo3:27017");
      } else {
        forceDesiredConfig();
      }

      for (var k = 0; k < 60; k++) {
        try {
          var st2 = rs.status();
          var has2 = st2.members.some(function(m) { return m.name === "mongo2:27017"; });
          var has3 = st2.members.some(function(m) { return m.name === "mongo3:27017"; });
          if (!has2) ensureMember("mongo2:27017");
          if (!has3) ensureMember("mongo3:27017");
          var hasPrimary = st2.members.some(function(m) { return m.stateStr === "PRIMARY"; });
          if (hasPrimary && has2 && has3) break;
        } catch (e) {}
        sleep(2000);
      }

      printjson(rs.status().members.map(function(m) { return { n: m.name, s: m.stateStr }; }));
    '

    echo "Creating root user (idempotent)..."
    mongosh admin --quiet --eval '
      try {
        db.createUser({
          // From Secret moneymaker-secrets (mongo1 env); dev defaults kept.
          user: process.env.MONGO_ROOT_USERNAME || "root",
          pwd: process.env.MONGO_ROOT_PASSWORD || "example",
          roles: [ { role: "root", db: "admin" } ]
        });
        print("root created");
      } catch (e) {
        print("createUser skipped:", e.codeName || e);
      }
    '

    echo "Stopping bootstrap mongod..."
    stop_mongod_and_wait

    echo "Writing signal for mongo2/mongo3..."
    touch /init-signal/done

    echo "Bootstrap complete. Restarting with auth + keyfile..."
    exec mongod --config /etc/mongod.conf
  init-mongo.sh: |
    #!/bin/bash
    set -e

    echo "Preparing keyfile..."
    cp -f /etc/mongo-keyfile /data/keyfile || { rm -f /data/keyfile && cp /etc/mongo-keyfile /data/keyfile; }
    chmod 400 /data/keyfile
    chown mongodb:mongodb /data/keyfile

    stop_mongod_and_wait() {
      echo "Stopping mongod..."
      mongosh --quiet --eval "try { db.getSiblingDB('admin').shutdownServer({force: true}); } catch (e) {}" >/dev/null 2>&1 || true
      mongod --shutdown --dbpath /data/db || true
      local waited=0
      while pgrep -x mongod >/dev/null 2>&1 && [ "$waited" -lt 30 ]; do
        sleep 1
        waited=$((waited + 1))
      done
      if pgrep -x mongod >/dev/null 2>&1; then
        echo "mongod did not exit cleanly after shutdown, sending SIGKILL..."
        pkill -9 -x mongod || true
        sleep 1
      fi
      rm -f /data/db/mongod.lock
    }

    mongo_rs_configured() {
      mongosh --quiet --eval '
        try {
          var h = db.hello();
          if (h && h.setName) quit(0);
          quit(1);
        } catch (e) {
          quit(1);
        }
      ' >/dev/null 2>&1
    }

    if [ -f /init-signal/done ]; then
      echo "Init signal present — validating replica set before skipping bootstrap..."
      mongod --config /etc/mongod.conf --fork --logpath /tmp/mongod-probe.log
      until mongosh --quiet --eval "db.adminCommand('ping')" &>/dev/null; do
        sleep 1
      done
      if mongo_rs_configured; then
        echo "Replica set OK — starting with auth..."
        stop_mongod_and_wait
        exec mongod --config /etc/mongod.conf
      fi
      echo "Stale init signal (no replica set config) — waiting for mongo1 to replace it..."
      stop_mongod_and_wait
      # Do not delete /init-signal/done here. mongo1, mongo2, and mongo3 share that
      # file; a secondary rm can wipe the signal mongo1 just wrote and leave the
      # other members waiting forever.
      stale_mtime="$(stat -c %Y /init-signal/done 2>/dev/null || true)"
    fi

    echo "Starting MongoDB WITHOUT auth for bootstrap (secondary)..."
    mongod --config /etc/mongod-bootstrap.conf --fork --logpath /tmp/mongod.log

    echo "Waiting for bootstrap signal from mongo1..."
    while true; do
      if [ -f /init-signal/done ]; then
        now_mtime="$(stat -c %Y /init-signal/done 2>/dev/null || true)"
        if [ -z "${stale_mtime:-}" ] || [ "$now_mtime" != "$stale_mtime" ]; then
          break
        fi
      fi
      echo "  ...waiting for signal..."
      sleep 2
    done

    echo "Signal received, restarting with auth + keyfile..."
    stop_mongod_and_wait

    exec mongod --config /etc/mongod.conf
