apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: moneymaker
  labels:
    app: redis
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: moneymaker
  labels:
    app: redis
    app.kubernetes.io/part-of: moneymaker
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: moneymaker
    spec:
      containers:
        - name: redis
          image: redis/redis-stack:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              hostPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_PASSWORD
            # redis-cli in the probes reads this instead of -a <password>.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_ARGS
              value: "--requirepass $(REDIS_PASSWORD) --maxmemory 256mb --maxmemory-policy allkeys-lru"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
