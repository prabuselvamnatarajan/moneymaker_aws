apiVersion: v1
kind: Service
metadata:
  name: position-tracker-consumer
  namespace: moneymaker
  labels:
    app: position-tracker-consumer
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: position-tracker-consumer
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: position-tracker-consumer
  namespace: moneymaker
  labels:
    app: position-tracker-consumer
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: position-tracker-consumer
  template:
    metadata:
      labels:
        app: position-tracker-consumer
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in zookeeper:2181 kafka-broker-1:9092 kafka-broker-2:9092 kafka-broker-3:9092 mongo1:27017 mongo2:27017 mongo3:27017 redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: position-tracker-consumer
          image: position-tracker-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SERVICE_NAME
              value: 'position-tracker-consumer'
            - name: SERVICE_MODE
              value: 'live'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKERS
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_NUM_PARTITIONS
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: MONGO_URI
            - name: MONGO_DB
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: MONGO_DB_BACKTEST
            - name: TARGET_TOPIC
              value: 'splited-live-data,backtest-stream-data'
            - name: TARGET_GROUP_ID
              value: 'position_tracker_group'
            - name: UNREALISED_WRITE_THROTTLE_MS
              value: '2000'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: position-tracker-consumer
  labels:
    app: position-tracker-consumer
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: position-tracker-consumer
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
