apiVersion: v1
kind: Service
metadata:
  name: timeframe-constructor
  namespace: moneymaker
  labels:
    app: timeframe-constructor
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: timeframe-constructor
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeframe-constructor
  namespace: moneymaker
  labels:
    app: timeframe-constructor
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timeframe-constructor
  template:
    metadata:
      labels:
        app: timeframe-constructor
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in zookeeper:2181 kafka-broker-1:9092 kafka-broker-2:9092 kafka-broker-3:9092 redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: timeframe-constructor
          image: timeframe-constructor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SERVICE_NAME
              value: 'timeframe-constructor'
            - name: SERVICE_MODE
              value: 'live'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKERS
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_NUM_PARTITIONS
            - name: INPUT_TOPICS
              value: 'splited-live-data,backtest-stream-data'
            - name: BACKTEST_INPUT_TOPIC
              value: 'backtest-stream-data'
            - name: OUTPUT_LIVE_TOPIC
              value: 'timeframe_live_data'
            - name: OUTPUT_BACKTEST_TOPIC
              value: 'timeframe_backtest_data'
            - name: CONSUMER_GROUP_ID
              value: 'timeframe_constructor_group'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: timeframe-constructor
  labels:
    app: timeframe-constructor
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: timeframe-constructor
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
