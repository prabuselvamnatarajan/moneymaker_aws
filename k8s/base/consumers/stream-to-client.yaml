apiVersion: v1
kind: Service
metadata:
  name: stream-to-client
  namespace: moneymaker
  labels:
    app: stream-to-client
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: stream-to-client
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-to-client
  namespace: moneymaker
  labels:
    app: stream-to-client
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-to-client
  template:
    metadata:
      labels:
        app: stream-to-client
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: stream-to-client
          image: stream-to-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WS_PORT
              value: '8080'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: LIVE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: LIVE_PREFIX
            - name: BACKTEST_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: BACKTEST_PREFIX
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stream-to-client
  labels:
    app: stream-to-client
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stream-to-client
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
