apiVersion: v1
kind: ConfigMap
metadata:
  name: common-env
  namespace: moneymaker
  labels:
    app.kubernetes.io/part-of: moneymaker
data:
  KAFKA_BROKERS: "kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092"
  KAFKA_NUM_PARTITIONS: "50"
  LIVE_PREFIX: live
  BACKTEST_PREFIX: backtest
  SERVICE_MODE_LIVE: live
  SERVICE_MODE_BACKTEST: backtest
  PLACEORDER_API: http://placeorder
  GET_OHLC_API: http://get-ohlc
  SWEEP_LOG_API: http://backtest-app
  BACKTEST_APP_URL_DIRECT: http://backtest-app:80
  GET_LTP_SERVICE_URL: http://get-ltp:80
  GET_OPTION_CHAIN_SERVICE_URL: http://get-put-call-option-chain:80
  NGINX_ADDRESS: https://reverse-proxy
  SHARED_DIR: /shared
  REDIRECT_URI: "http://localhost/logedin"
  MONGO_DB_BACKTEST: BacktestApp
  DB_NAME: stock_database
