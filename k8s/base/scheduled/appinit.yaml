apiVersion: batch/v1
kind: Job
metadata:
  name: appinit
  namespace: moneymaker
  labels:
    app: appinit
    app.kubernetes.io/part-of: moneymaker
  annotations:
    # Re-run on each apply by giving a unique suffix from deploy script if needed.
    argocd.argoproj.io/hook: Sync
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: appinit
        app.kubernetes.io/part-of: moneymaker
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in mongo1:27017 mongo2:27017 mongo3:27017 redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                until nc -z "$host" "$port"; do sleep 2; done
              done
      containers:
        - name: appinit
          image: appinit:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: MONGO_URI
            - name: APP_INIT_DB
              value: appInit
            - name: DB_LIVE_STRATEGYCHOOSER
              value: strategyChooser
            - name: REDIS_LIVE_STRATEGYCHOOSER
              value: '{"key":"strategies:live:","data_type":"json"}'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: PROPERTY_LIVE_STRATEGYCHOOSER
              value: symbolName
            - name: DB_LIVE_WEBSOCKETLISTENING
              value: webSocketListening
            - name: REDIS_LIVE_WEBSOCKETLISTENING
              value: '{"key":"websocketlistening:live","data_type":"list"}'
            - name: PROPERTY_LIVE_WEBSOCKETLISTENING
              value: symbolName
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
