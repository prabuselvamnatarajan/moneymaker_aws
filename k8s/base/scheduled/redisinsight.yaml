apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redisinsight-data
  namespace: moneymaker
  labels:
    app: redisinsight
    app.kubernetes.io/part-of: moneymaker
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redisinsight
  namespace: moneymaker
  labels:
    app: redisinsight
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: redisinsight
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redisinsight
  namespace: moneymaker
  labels:
    app: redisinsight
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redisinsight
  template:
    metadata:
      labels:
        app: redisinsight
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in redis:6379; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: redisinsight
          image: redislabs/redisinsight:1.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              hostPort: 8001
              name: http
          env:
            - name: TZ
              value: 'UTC'
          volumeMounts:
            - name: data
              mountPath: /db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redisinsight-data

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redisinsight
  labels:
    app: redisinsight
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redisinsight
  # hostPort 8001 and a single RWO volume — keep one pod.
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
