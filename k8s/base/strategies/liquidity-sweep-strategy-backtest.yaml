apiVersion: v1
kind: Service
metadata:
  name: liquidity-sweep-strategy-backtest
  namespace: moneymaker
  labels:
    app: liquidity-sweep-strategy-backtest
    app.kubernetes.io/part-of: moneymaker
spec:
  type: ClusterIP
  selector:
    app: liquidity-sweep-strategy-backtest
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liquidity-sweep-strategy-backtest
  namespace: moneymaker
  labels:
    app: liquidity-sweep-strategy-backtest
    app.kubernetes.io/part-of: moneymaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: liquidity-sweep-strategy-backtest
  template:
    metadata:
      labels:
        app: liquidity-sweep-strategy-backtest
        app.kubernetes.io/part-of: moneymaker
    spec:
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -e
              for h in zookeeper:2181 kafka-broker-1:9092 kafka-broker-2:9092 kafka-broker-3:9092 redis:6379 get-ohlc:80 backtest-app:80; do
                host="${h%%:*}"; port="${h##*:}"
                echo "Waiting for $host:$port..."
                until nc -z "$host" "$port"; do sleep 2; done
                echo "Ready: $host:$port"
              done
      containers:
        - name: liquidity-sweep-strategy-backtest
          image: liquidity-sweep-strategy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SERVICE_NAME
              value: 'liquidity-sweep-strategy-service'
            - name: SERVICE_MODE
              value: 'backtest'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: REDIS_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_BROKERS
            - name: KAFKA_NUM_PARTITIONS
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: KAFKA_NUM_PARTITIONS
            - name: TARGET_TOPIC
              value: 'liquidity_sweep_backtest_data'
            - name: TARGET_GROUP_ID
              value: 'backtest_liquidity_sweep_strategy_group'
            - name: SHARED_DIR
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: SHARED_DIR
            - name: PLACEORDER_API
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: PLACEORDER_API
            - name: STRATEGY_NAME
              value: 'liquidity_sweep'
            - name: GET_OHLC_API
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: GET_OHLC_API
            - name: SWEEP_LOG_API
              valueFrom:
                configMapKeyRef:
                  name: common-env
                  key: SWEEP_LOG_API
            - name: BACKTEST_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: moneymaker-secrets
                  key: BACKTEST_SERVICE_TOKEN
            - name: IS_BACKTEST
              value: 'true'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: liquidity-sweep-strategy-backtest
  labels:
    app: liquidity-sweep-strategy-backtest
    app.kubernetes.io/part-of: moneymaker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: liquidity-sweep-strategy-backtest
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 90
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 90
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
