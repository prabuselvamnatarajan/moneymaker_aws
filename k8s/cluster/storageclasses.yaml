# Cluster-scoped StorageClasses for EKS, applied by
# scripts/aws/install-cluster-addons.sh (infra workflow), not by the app deploy.
# __EFS_FILE_SYSTEM_ID__ is replaced with terraform output efs_file_system_id.
---
# Default class: Mongo / Redis volumeClaimTemplates (ReadWriteOnce, EBS gp3).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# ReadWriteMany: Mongo bootstrap signal and the shared backtest-data volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: __EFS_FILE_SYSTEM_ID__
  directoryPerms: "700"
reclaimPolicy: Retain
volumeBindingMode: Immediate
